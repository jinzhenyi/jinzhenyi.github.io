# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
remote_theme             : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "dark"

# Site Settings
locale                   : "zh-CN"
title                    : "JZY的博客"
title_separator          : "-"
name                     : "JZY"
description              : "JZY 的个人技术博客，记录学习与思考。"
url                      : "https://jinzhenyi.dpdns.org"
baseurl                  : 
repository               : "jinzhenyi/jinzhenyi.github.io"
words_per_minute         : 200

# ========== 搜索配置（本地 Lunr） ==========
search                   : true
search_full_content      : false
search_provider          : lunr          # 使用本地 Lunr 搜索，无需 API Key

# ========== 评论系统 - Giscus ==========
comments:
  provider               : "giscus"
  giscus:
    repo_id              : "R_kgDOS-4UFg"
    category_name        : "Announcements"
    category_id          : "DIC_kwDOS-4UFs4C_dV1"
    discussion_term      : "pathname"
    reactions_enabled    : "1"
    theme                : "noborder_dark"
    strict               : "0"
    input_position       : "bottom"
    emit_metadata        : "0"
    lang                 : "zh-CN"
    lazy                 : false

# ========== SEO 验证（Bing / Yandex） ==========
bing_site_verification   :    # 填你的 Bing 密钥（如有）
yandex_site_verification :    # DNS 验证通过后留空即可

# ========== 站点作者 ==========
author:
  name             : "JZY"
  avatar           : "/assets/images/tx.png"
  bio              : 
  location         : "Shanghai, China"
  email            : "zhenyi20231221@outlook.com"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-square-envelope"
      url: "mailto:zhenyi20231221@outlook.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jinzhenyi"
    - label: "B站"
      icon: "fab fa-bilibili"
      url: "https://space.bilibili.com/1230896672"

# ========== 页脚 ==========
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jinzhenyi"
    - label: "B站"
      icon: "fab fa-bilibili"
      url: "https://space.bilibili.com/1230896672"
  since: "2026"

# ========== Jekyll 标准配置 ==========
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations: ['import']

permalink: /:categories/:title/
timezone: Asia/Shanghai

paginate: 5
paginate_path: /page:num/

pagination:
  enabled: false
  debug: false
  collection: 'posts'
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true
  category: 'posts'
  tag: ''
  locale: ''
  trail:
    before: 2
    after: 2

# ========== 插件 ==========
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  # jekyll-algolia 已移除（本地搜索不需要）

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true